<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Daily Bunny Generator</title>
    </head>
    <body class="flex flex-col h-screen box-border">
        <header class="flex h-10 bg-emerald-300 p-5 items-center">
            <h1>Daily Bunny Generator!</h1>
        </header>
        <main class="p-5 flex flex-col justify-center items-center gap-5">
            <div
                data-name="bunny-name"
                class="flex justify-center items-center h-10 w-40 bg-amber-300"
            >
                Name of bunny
            </div>
            <div>
                <img
                    src=""
                    alt="Image of bunny"
                    data-image="bunny-image"
                    width="500px"
                    height="500px"
                />
            </div>
            <div data-breed="bunny-breed">breed</div>
            <div>Time until next bunny</div>
            <div>
                <button>New bunny</button>
            </div>
        </main>
        <script type="module" src="/src/main.js"></script>
    </body>
</html>
